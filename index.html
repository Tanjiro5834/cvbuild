<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <title>ATS Resume Builder</title>

  <!-- Apply theme before first paint to avoid a flash -->
  <script>
    (function () {
      try {
        var pref = localStorage.getItem('theme') || 'system';
        var mql = window.matchMedia('(prefers-color-scheme: dark)');
        var resolved = pref === 'system' ? (mql.matches ? 'dark' : 'light') : pref;
        document.documentElement.setAttribute('data-theme', resolved);
        document.documentElement.setAttribute('data-theme-pref', pref);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>

  <!-- Google Fonts (only allowed external resource) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Open+Sans:wght@400;600;700&family=Lato:wght@400;700&family=Source+Sans+3:wght@400;600;700&family=Merriweather:wght@400;700&family=EB+Garamond:wght@400;600&family=Source+Serif+4:wght@400;600&family=Lora:wght@400;600&family=JetBrains+Mono:wght@400;600&family=IBM+Plex+Mono:wght@400;600&family=Roboto+Mono:wght@400;600&family=Source+Code+Pro:wght@400;600&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/resume.css" />
</head>
<body>
  <div id="app"></div>
  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="true"></div>
  <div id="modal-root"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
